name: Build and Push Docker

on:
  push:
    branches: [ master ]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/front-jade-service:latest
            ${{ secrets.DOCKER_USERNAME }}/front-jade-service:v${{ github.run_number }}

      - name: Deploy to Production
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            CONTAINER=$(sudo kubectl get deployment proyecto-key-front-deployment -n default -o jsonpath='{.spec.template.spec.containers[0].name}')
            sudo kubectl set image deployment/proyecto-key-front-deployment \
              $CONTAINER=${{ secrets.DOCKER_USERNAME }}/front-jade-service:v${{ github.run_number }} \
              -n default
            sudo kubectl rollout status deployment/proyecto-key-front-deployment -n default --timeout=120s
