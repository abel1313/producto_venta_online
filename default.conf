server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Encabezados de seguridad (SEGURIDAD_DATOS.md §6 del back). Van repetidos en cada location
  # porque nginx no hereda los add_header del server a una location que declara los suyos.
  # Permissions-Policy deja la cámara (escáner de código) y la ubicación ("Usar mi ubicación").
  location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }

  # Página "no existe" con status 404 de verdad. Angular no puede cambiar el status: el servidor
  # contesta 200 a cualquier ruta (try_files de abajo) y Google lo toma como "soft 404". Cuando se
  # abre directo una ruta que no existe, la app redirige aquí; nginx devuelve la app (index.html)
  # con 404, y Angular pinta la pantalla de "Esta página no existe".
  location = /no-encontrada {
    error_page 404 /index.html;
    return 404;
  }

  # Cache-Control y Pragma llevan `always` para que también apliquen a la respuesta 404 de arriba
  # (sin `always`, nginx solo los pone en 2xx/3xx y el navegador podría guardar la página de error).
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }
}
