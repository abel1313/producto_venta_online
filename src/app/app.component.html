<nb-layout>
  <nb-layout-column>
    <app-navbar></app-navbar>
    <div class="page-content">
      <!-- Cinta de promociones. Se oculta sola en login/registro/privacidad. -->
      <app-cinta></app-cinta>
      <router-outlet></router-outlet>

      <!-- TikTok (App Review) exige que Privacidad y Términos se vean en el sitio sin abrir un menú. -->
      <footer class="pie-legal">
        <span>© {{ anio }} Novedades Jade</span>
        <!-- LFPC 76 bis III: quién vende, domicilio, teléfono y correo, visibles antes de comprar.
             Salen de Configuración del negocio → Datos legales; lo que no esté capturado no se pinta. -->
        <address class="pie-legal__contacto" *ngIf="datosLegales$ | async as d">
          <span *ngIf="d.nombreResponsable">{{ d.nombreResponsable }}</span>
          <span *ngIf="d.domicilio">{{ d.domicilio }}</span>
          <a *ngIf="d.telefono" [href]="'tel:+52' + d.telefono">Tel. {{ telefonoLegible(d.telefono) }}</a>
          <a *ngIf="d.correo" [href]="'mailto:' + d.correo">{{ d.correo }}</a>
          <span *ngIf="d.horarioAtencion">Atención: {{ d.horarioAtencion }}</span>
        </address>
        <nav aria-label="Información legal">
          <a routerLink="/privacidad">Aviso de privacidad</a>
          <a routerLink="/termConditions">Términos y condiciones</a>
          <a routerLink="/eliminar-datos">Eliminar mis datos</a>
        </nav>
      </footer>
    </div>
  </nb-layout-column>
</nb-layout>

<app-loading></app-loading>
<app-chatbot></app-chatbot>

<!-- Ayuda contextual del admin: una sola instancia cubre todas las pantallas porque el
     componente resuelve el texto por la ruta activa. Se oculta solo en las pantallas que no
     están en el catálogo (tienda pública, login) y en los roles sin el permiso. -->
<app-ayuda-pantalla [flotante]="true"></app-ayuda-pantalla>
