<div class="cp-page">
  <div class="cp-card">

    <!-- Header -->
    <div class="cp-header">
      <div class="cp-icon">
        <i class="pi pi-shield"></i>
      </div>
      <h2 class="cp-title">Cambiar contraseña</h2>
      <p class="cp-sub">Ingresa tu contraseña actual y después la nueva.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="cambiar()">

      <div class="cp-field">
        <label class="cp-label">Contraseña actual</label>
        <div class="cp-input-wrap">
          <i class="pi pi-lock cp-input-icon"></i>
          <input class="cp-input" [type]="mostrarActual ? 'text' : 'password'"
                 formControlName="passwordActual" placeholder="Tu contraseña actual"
                 autocomplete="current-password" />
          <button type="button" class="cp-toggle-pass"
                  (click)="mostrarActual = !mostrarActual" tabindex="-1">
            <i class="pi" [ngClass]="mostrarActual ? 'pi-eye-slash' : 'pi-eye'"></i>
          </button>
        </div>
        <small class="cp-error"
               *ngIf="form.get('passwordActual')?.invalid && form.get('passwordActual')?.touched">
          Campo requerido.
        </small>
      </div>

      <div class="cp-divider"></div>

      <div class="cp-field">
        <label class="cp-label">Nueva contraseña</label>
        <div class="cp-input-wrap">
          <i class="pi pi-lock cp-input-icon"></i>
          <input class="cp-input" [type]="mostrarNueva ? 'text' : 'password'"
                 formControlName="nuevaPassword" placeholder="Mínimo 8 caracteres"
                 autocomplete="new-password" />
          <button type="button" class="cp-toggle-pass"
                  (click)="mostrarNueva = !mostrarNueva" tabindex="-1">
            <i class="pi" [ngClass]="mostrarNueva ? 'pi-eye-slash' : 'pi-eye'"></i>
          </button>
        </div>
        <small class="cp-error"
               *ngIf="form.get('nuevaPassword')?.invalid && form.get('nuevaPassword')?.touched">
          Mínimo 8 caracteres.
        </small>
      </div>

      <div class="cp-field">
        <label class="cp-label">Confirmar nueva contraseña</label>
        <div class="cp-input-wrap">
          <i class="pi pi-lock cp-input-icon"></i>
          <input class="cp-input" [type]="mostrarConfirmar ? 'text' : 'password'"
                 formControlName="confirmarPassword" placeholder="Repite la nueva contraseña"
                 autocomplete="new-password" />
          <button type="button" class="cp-toggle-pass"
                  (click)="mostrarConfirmar = !mostrarConfirmar" tabindex="-1">
            <i class="pi" [ngClass]="mostrarConfirmar ? 'pi-eye-slash' : 'pi-eye'"></i>
          </button>
        </div>
        <small class="cp-error"
               *ngIf="form.errors?.['noCoincide'] && form.get('confirmarPassword')?.touched">
          Las contraseñas no coinciden.
        </small>
      </div>

      <div class="cp-error-msg" *ngIf="errorMsg">
        <i class="pi pi-exclamation-circle"></i> {{ errorMsg }}
      </div>

      <button type="submit" class="cp-btn"
              [disabled]="form.invalid || guardando">
        <i class="pi pi-check"></i>
        {{ guardando ? 'Guardando…' : 'Cambiar contraseña' }}
      </button>

    </form>

  </div>
</div>
