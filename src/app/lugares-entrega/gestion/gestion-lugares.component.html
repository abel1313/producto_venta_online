<div class="pk-wrap">

  <div class="pk-header">
    <h4 class="pk-header__title">📍 Catálogo de lugares de entrega</h4>
    <small class="pk-header__sub">Zonas usadas para filtrar pedidos por lugar de entrega</small>
  </div>

  <!-- Formulario agregar / editar -->
  <form [formGroup]="form" (ngSubmit)="guardar()" class="pk-form">
    <div class="pk-form__field">
      <input class="pk-input"
             formControlName="nombre"
             type="text"
             [placeholder]="editandoId ? 'Nuevo nombre…' : 'Nuevo lugar…'"
             autocomplete="off"
             maxlength="80" />
      <small class="pk-error" *ngIf="ctrl?.invalid && ctrl?.touched">
        El nombre es obligatorio
      </small>
    </div>

    <button class="pk-btn pk-btn--save" type="submit" [disabled]="guardando">
      {{ editandoId ? '💾 Actualizar' : '➕ Agregar' }}
    </button>

    <button *ngIf="editandoId" class="pk-btn pk-btn--cancel" type="button" (click)="cancelarEdicion()">
      ✕ Cancelar
    </button>
  </form>

  <!-- Vacío -->
  <div *ngIf="!cargando && lugares.length === 0 && page === 0" class="pk-empty">
    Sin lugares de entrega — agrega el primero arriba
  </div>

  <!-- Tabla paginada -->
  <div class="pk-table-wrap" *ngIf="!cargando && lugares.length > 0">
    <table class="pk-table">
      <thead>
        <tr>
          <th>Nombre</th>
          <th class="pk-table__col-actions"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let l of lugares" [class.pk-row--editando]="editandoId === l.id">
          <td>{{ l.nombre }}</td>
          <td class="pk-table__actions">
            <button class="pk-btn pk-btn--edit" (click)="iniciarEdicion(l)" title="Editar">✏️</button>
            <button class="pk-btn pk-btn--del"  (click)="eliminar(l)"       title="Eliminar">🗑️</button>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="pk-pagination">
      <button class="pk-btn pk-btn--page" [disabled]="page === 0" (click)="paginaAnterior()">← Anterior</button>
      <span class="pk-pagination__info">Página {{ page + 1 }}</span>
      <button class="pk-btn pk-btn--page" [disabled]="!haySiguiente" (click)="siguientePagina()">Siguiente →</button>
    </div>
  </div>

  <!-- Página vacía por haber eliminado el último item (no debería verse casi nunca, red de seguridad) -->
  <div *ngIf="!cargando && lugares.length === 0 && page > 0" class="pk-empty">
    Sin más lugares en esta página.
    <button class="pk-btn pk-btn--page" (click)="paginaAnterior()">← Volver</button>
  </div>

</div>
