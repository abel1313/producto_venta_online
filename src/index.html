<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>Novedades Jade — Bolsas, Pantalones, Blusas y Perfumes</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- SEO básico -->
  <meta name="description" content="Tienda en línea de moda femenina. Bolsas, pantalones, blusas y perfumes originales de 10 ml. Envíos y pedidos en línea.">

  <meta name="robots" content="index, follow">

  <!-- Open Graph (Facebook, WhatsApp, Instagram)
       ⚠️ La URL de og:image DEBE ser absoluta (https://...). WhatsApp y Facebook piden la
       página desde SUS servidores, no desde el navegador del usuario, así que una ruta
       relativa como "/assets/og-image.jpg" no la saben resolver y la tarjeta sale sin foto.
       Antes apuntaba a un archivo que ni siquiera existía (404 en producción).

       Esta imagen es FIJA: la misma para toda la tienda. Para que salga la foto del producto
       que se está compartiendo haría falta render en servidor (SSR) o un servicio que sirva
       meta tags por producto — los bots de WhatsApp/Facebook no ejecutan la app de Angular,
       solo leen este archivo tal cual. -->
  <meta property="og:type"        content="website">
  <meta property="og:site_name"   content="Novedades Jade">
  <meta property="og:url"         content="https://shop.novedades-jade.com.mx/">
  <meta property="og:title"       content="Novedades Jade — Moda Femenina">
  <meta property="og:description" content="Bolsas, pantalones, blusas y perfumes originales. Haz tu pedido en línea.">
  <meta property="og:image"       content="https://shop.novedades-jade.com.mx/assets/og-image.jpg">
  <meta property="og:image:type"  content="image/jpeg">
  <meta property="og:image:alt"   content="Novedades Jade — bolsas, blusas, pantalones y perfumes">
  <meta property="og:locale"      content="es_MX">

  <!-- Twitter / X -->
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="Novedades Jade — Moda Femenina">
  <meta name="twitter:description" content="Bolsas, pantalones, blusas y perfumes originales.">
  <meta name="twitter:image"       content="https://shop.novedades-jade.com.mx/assets/og-image.jpg">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="canonical" href="https://shop.novedades-jade.com.mx/">
</head>
